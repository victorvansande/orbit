<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Orbit</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<main class="app">
  <header class="masthead">
    <h1 class="title">Orbit</h1>
    <p class="summary" id="summary" aria-live="polite"></p>
  </header>

  <div class="segmented" id="view-toggle" role="radiogroup" aria-label="Aanzicht" style="--count:2;--index:0">
    <label><input type="radio" name="view" id="view-top" value="top" checked><span>Boven</span></label>
    <label><input type="radio" name="view" id="view-side" value="side"><span>Zijkant</span></label>
  </div>

  <div class="scene-wrap" id="scene-wrap">
    <div class="scene" id="scene" data-view="top" role="img" aria-label="Orbit">
      <div class="camera" aria-hidden="true">
        <div class="spin">
          <div class="origin">
            <div class="layer" id="rings"></div>
            <div class="layer" id="meridians"></div>
            <div class="layer"><span class="tip" id="tip"></span></div>
            <div class="layer" id="orbits"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <ul class="legend" id="legend"></ul>

  <section class="group" aria-label="Taken">
    <ul class="list" id="list"></ul>
    <button type="button" class="add" id="add">
      <span class="add-icon" aria-hidden="true"><svg viewBox="0 0 22 22" width="22" height="22"><circle cx="11" cy="11" r="11" fill="currentColor"/><path d="M11 6.5v9M6.5 11h9" stroke="#000" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span>Nieuwe taak</span>
    </button>
  </section>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <form id="task-form" novalidate>
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-bar">
      <button type="button" class="bar-btn" id="cancel">Annuleer</button>
      <h2 class="sheet-title" id="sheet-title">Nieuwe taak</h2>
      <button type="submit" class="bar-btn strong" id="confirm" disabled>Voeg toe</button>
    </div>
    <div class="field">
      <input id="task-title" name="title" type="text" placeholder="Titel" autocomplete="off" enterkeyhint="done" maxlength="120" aria-label="Titel">
    </div>
    <p class="field-label" id="prio-label">Prioriteit</p>
    <div class="segmented prio" id="prio" role="radiogroup" aria-labelledby="prio-label" style="--count:5;--index:2"></div>
  </form>
</dialog>

<script src="src/app.js" defer></script>
</body>
</html>
