<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F1EF">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Orbit: je taken draaien als bollen rond vijf ringen. Hoe dringender, hoe dichter bij de kern.">
<title>Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="src/styles.css">
<script>
  // Thema zetten vóór de eerste weergave, zodat er geen lichte flits is
  (() => {
    let pref = 'auto';
    try { pref = localStorage.getItem('priority-orbit.theme.v1') || 'auto'; } catch { /* geen opslag */ }
    const dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="scene" role="img" aria-label="Orbit"></canvas>
</div>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="hud-block">
    <h1 class="brand">Orbit</h1>
    <p class="summary" id="summary" aria-live="polite"></p>
  </div>
  <div class="hud-block hud-right">
    <p id="week" aria-hidden="true"></p>
    <p class="muted" id="date" aria-hidden="true"></p>
    <div class="views theme-switch" role="radiogroup" aria-label="Thema">
      <button type="button" role="radio" aria-checked="false" data-theme-pref="light">Licht</button>
      <span class="slash" aria-hidden="true">/</span>
      <button type="button" role="radio" aria-checked="false" data-theme-pref="dark">Donker</button>
      <span class="slash" aria-hidden="true">/</span>
      <button type="button" role="radio" aria-checked="true" data-theme-pref="auto">Auto</button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="views" role="radiogroup" aria-label="Aanzicht">
    <button type="button" role="radio" aria-checked="true" data-view="top">Boven</button>
    <span class="slash" aria-hidden="true">/</span>
    <button type="button" role="radio" aria-checked="false" data-view="side">Zijkant</button>
  </div>
  <button type="button" class="focus-btn" id="focus-btn" aria-pressed="false">Focus <kbd>F</kbd></button>
  <div class="views tempo" role="radiogroup" aria-label="Tempo">
    <span class="tempo-label">Tempo <kbd>T</kbd></span>
    <button type="button" role="radio" aria-checked="true" data-tempo="normaal">Normaal</button>
    <span class="slash" aria-hidden="true">/</span>
    <button type="button" role="radio" aria-checked="false" data-tempo="zen">Zen</button>
    <span class="slash" aria-hidden="true">/</span>
    <button type="button" role="radio" aria-checked="false" data-tempo="stil">Stil</button>
  </div>
</div>

<nav class="wheel" id="wheel" aria-label="Nieuwe taak">
  <svg class="wheel-arc" aria-hidden="true"><path d=""/></svg>
  <span class="wheel-handle" aria-hidden="true"></span>
  <ul class="wheel-list" role="listbox" tabindex="0" aria-label="Kies een moment, druk Enter om een taak toe te voegen"></ul>
  <p class="wheel-hint" aria-hidden="true">Scroll · klik om toe te voegen</p>
</nav>

<section class="tracks" id="tracks" aria-labelledby="tracks-title">
  <div class="tracks-head">
    <h2 id="tracks-title">Taken</h2>
    <span id="tracks-count"></span>
  </div>
  <div class="groups" id="groups"></div>
  <p class="keys" aria-hidden="true"><kbd>N</kbd> nieuw <kbd>1</kbd><kbd>2</kbd> aanzicht <kbd>Z</kbd> ongedaan <kbd>T</kbd> tempo <kbd>D</kbd> thema</p>
</section>

<div class="focus-info" aria-hidden="true">
  <p class="clock" id="clock"></p>
  <p class="clock-date" id="clock-date"></p>
  <div class="focus-now" id="focus-now"></div>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toast-text"></span>
  <button type="button" id="undo">Ongedaan maken</button>
</div>

<dialog class="composer" id="composer" aria-labelledby="composer-kicker">
  <form id="composer-form" novalidate>
    <canvas class="composer-orb" id="composer-orb" width="560" height="560" aria-hidden="true"></canvas>
    <div class="composer-meta">
      <span id="composer-kicker">Nieuwe taak</span>
      <span class="composer-level" id="composer-level"></span>
    </div>
    <input class="composer-title" id="composer-title" name="title" type="text" placeholder="Wat moet er gebeuren?" autocomplete="off" enterkeyhint="done" maxlength="120" aria-label="Titel">
    <div class="composer-levels" id="composer-levels" role="radiogroup" aria-label="Moment"></div>
    <div class="composer-due">
      <button type="button" class="due-toggle" id="due-toggle"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>Deadline</button>
      <div class="due-field" id="due-field" hidden>
        <input type="date" class="due-input" id="composer-due" aria-label="Deadline">
        <button type="button" class="due-clear" id="due-clear">Wissen</button>
      </div>
      <p class="due-hint" id="due-hint" aria-live="polite"></p>
    </div>
    <div class="composer-actions">
      <button type="button" class="btn-ghost" id="composer-cancel">Annuleer</button>
      <button type="submit" class="btn-solid" id="composer-submit" disabled>Voeg toe <kbd>↵</kbd></button>
    </div>
  </form>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
