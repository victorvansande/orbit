name: Orbit-server naar Cloudflare

# Zet de sync-server (map worker/) op Cloudflare Workers. De site zelf blijft op GitHub Pages.
# Nodig: repo-secrets CLOUDFLARE_API_TOKEN en CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/sync-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy met Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: '4.153.0'
